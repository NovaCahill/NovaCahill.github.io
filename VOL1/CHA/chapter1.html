<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HERE - Volume 01 chapter index.">
  <title>HERE - Volume 01</title>
  <style>
    :root {
      --navy: #071d49;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--navy);
      background: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    header {
      display: flex;
      min-height: 76px;
      border-bottom: 2px solid var(--navy);
    }

    .brand,
    .back {
      display: flex;
      align-items: center;
      padding: 0 4vw;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .brand {
      flex: 1;
      color: var(--white);
      background: var(--navy);
      font-size: clamp(1.4rem, 2.6vw, 2.6rem);
      font-weight: 900;
      letter-spacing: 0.3em;
    }

    .back {
      border-left: 2px solid var(--navy);
      transition: color 180ms ease, background 180ms ease;
    }

    .back:hover,
    .back:focus-visible {
      color: var(--white);
      background: var(--navy);
      outline: none;
    }

    main {
      padding: clamp(4rem, 9vw, 9rem) 4vw;
    }

    .kicker {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.23em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.12em 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 0.9;
    }

    .note {
      max-width: 34rem;
      margin: 2rem 0 4rem;
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .chapter-list {
      border-top: 2px solid var(--navy);
    }

    .chapter {
      display: grid;
      grid-template-columns: 0.35fr 1fr 0.5fr;
      align-items: center;
      min-height: 145px;
      border-bottom: 2px solid var(--navy);
      text-decoration: none;
      transition: color 180ms ease, background 180ms ease;
    }

    .chapter:hover,
    .chapter:focus-visible {
      color: var(--white);
      background: var(--navy);
      outline: none;
    }

    .chapter > span {
      display: flex;
      align-items: center;
      align-self: stretch;
      padding: 1.5rem;
    }

    .chapter > span + span {
      border-left: 2px solid var(--navy);
    }

    .chapter:hover > span + span,
    .chapter:focus-visible > span + span {
      border-left-color: var(--white);
    }

    .number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 6vw, 6rem);
      line-height: 1;
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 3vw, 2.8rem);
    }

    .meta {
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 2rem 4vw;
      color: var(--white);
      background: var(--navy);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @media (max-width: 700px) {
      header {
        min-height: 64px;
      }

      .back {
        padding: 0 1rem;
        font-size: 0.58rem;
      }

      .chapter {
        display: block;
      }

      .chapter > span {
        min-height: 90px;
      }

      .chapter > span + span {
        border-top: 2px solid var(--navy);
        border-left: 0;
      }

      .chapter:hover > span + span,
      .chapter:focus-visible > span + span {
        border-top-color: var(--white);
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="volume.html">HERE</a>
    <a class="back" href="volume.html#volumes">&larr; Volumes</a>
  </header>

  <main>
    <p class="kicker">Volume 01 &middot; Observations</p>
    <h1>Chapter Main Tittle</h1>
    <p class="note">Select a document below. Replace each placeholder link with the path to its uploaded PDF.</p>

    <div class="chapter-list">
      <a class="chapter" href="VOL1/CHA/WRTV1CH1/writing1.html" aria-label="Read Beginnings">

        <span class="title">邀约</span>
        <span class="meta"><span>Click</span><span>Coming soon &nearr;</span></span>
      </a>
      
</a>




    </div>
  </main>

  <footer>
    <span>HERE &middot; Volume 01</span>
    <a href="volume.html#volumes">All volumes &uarr;</a>
  </footer>
</body>
</html>
